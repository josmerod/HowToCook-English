name: Continuous Deployment

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  packages: write

jobs:
  build-readme-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npm run build
      - run: npm run lint
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '[ci skip] Automatic file changes/fix'
          branch: 'master'
          file_pattern: 'README.md starsystem/*.md'
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

  build-docker-image:
    needs: build-readme-file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the Docker image
        run: |
          docker build . --tag ghcr.io/${{ github.repository_owner }}/how-to-cook-english:latest
          docker push ghcr.io/${{ github.repository_owner }}/how-to-cook-english:latest
